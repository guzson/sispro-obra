spring.application.name=sispro-obra

# PostgreSQL (se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sispro_obra}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Servidor web
server.port=${PORT:8080}

# Usuarios y datos de demostración (poner en false antes de publicar)
sispro.demo.enabled=true
