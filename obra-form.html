<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar obra | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><section class="panel narrow">
<h2 th:text="${obra.id != null ? 'Editar obra' : 'Registrar nueva obra'}">Registrar nueva obra</h2>
<p>Si no eliges ingeniero residente, la obra queda como <strong>BORRADOR</strong> y no admite incidencias.</p>
<form th:action="@{/obras/guardar}" method="post">
<input type="hidden" name="id" th:value="${obra.id}">
<label for="nombre">Nombre de la obra</label><input id="nombre" type="text" name="nombre" th:value="${obra.nombre}" required>
<label for="direccion">Dirección</label><input id="direccion" type="text" name="direccion" th:value="${obra.direccion}" required>
<label for="latitud">Latitud (opcional)</label><input id="latitud" type="number" step="any" name="latitud" th:value="${obra.latitud}">
<label for="longitud">Longitud (opcional)</label><input id="longitud" type="number" step="any" name="longitud" th:value="${obra.longitud}">
<label for="fechaInicio">Fecha de inicio</label><input id="fechaInicio" type="date" name="fechaInicio" th:value="${obra.fechaInicio}" required>
<label for="fechaFin">Fecha de fin</label><input id="fechaFin" type="date" name="fechaFin" th:value="${obra.fechaFin}" required>
<label for="ingenieroId">Ingeniero residente</label>
<select id="ingenieroId" name="ingenieroId"><option value="">Sin asignar</option>
<option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre + ' (' + u.rol + ')'}" th:selected="${obra.ingenieroResidente != null and obra.ingenieroResidente.id == u.id}"></option></select>
<div class="actions"><a class="btn" th:href="@{/obras}">Cancelar</a><button class="primary" type="submit">Guardar obra</button></div>
</form></section></main><footer>SISPRO-OBRA · Proyecto académico Java + Spring Boot + PostgreSQL</footer></body></html>
