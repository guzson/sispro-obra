<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header style="text-align:center"><h1>SISPRO-OBRA</h1><p>Crear cuenta de trabajador</p></header><main><section class="panel narrow"><h2>Registro de usuario</h2><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/registro}" method="post"><label>Nombre completo</label><input name="nombre" required maxlength="120"><label>Correo electrónico</label><input name="correo" type="email" required><label>Teléfono (9 dígitos)</label><input name="telefono" pattern="[0-9]{9}" required><label>Contraseña (8 caracteres, mayúscula, minúscula y número)</label><input name="clave" type="password" minlength="8" required><div class="actions"><a class="btn" th:href="@{/login}">Volver</a><button type="submit" class="primary">Registrarme</button></div></form><p>Las cuentas nuevas reciben el rol TRABAJADOR. Solo el administrador puede asignar otros roles.</p></section></main></body></html>
