<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Obras | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><section class="panel"><div class="eyebrow">PROYECTOS</div><h1>Gestión de obras</h1><p class="sub">Consulta las obras a las que tienes acceso.</p><p><a class="btn primary" th:if="${#authorization.expression('hasRole(''ADMINISTRADOR'')')}" th:href="@{/obras/nueva}">+ Nueva obra</a></p><table><thead><tr><th>Nombre</th><th>Dirección</th><th>Inicio</th><th>Fin estimado</th><th>Ingeniero</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="o:${obras}"><td><a class="item-link" th:href="@{/obras/{id}(id=${o.id})}" th:text="${o.nombre}"></a></td><td th:text="${o.direccion}"></td><td th:text="${o.fechaInicio}"></td><td th:text="${o.fechaFin}"></td><td th:text="${o.ingenieroResidente!=null?o.ingenieroResidente.nombre:'Sin asignar'}"></td><td th:text="${o.estado}"></td><td><a th:if="${#authorization.expression('hasRole(''ADMINISTRADOR'')') and o.estado.name()!='CERRADA'}" class="btn small" th:href="@{/obras/{id}/editar(id=${o.id})}">Editar</a><form style="display:inline" th:if="${#authorization.expression('hasRole(''ADMINISTRADOR'')') and o.estado.name()!='CERRADA'}" th:action="@{/obras/{id}/cerrar(id=${o.id})}" method="post"><button class="small" onclick="return confirm('¿Cerrar esta obra?')">Cerrar</button></form></td></tr></tbody></table></section></main><footer>SISPRO-OBRA · Proyecto académico Java + Spring Boot + PostgreSQL</footer></body></html>
