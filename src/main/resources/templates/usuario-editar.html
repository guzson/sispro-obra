<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar usuario | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><section class="panel narrow"><h2>Editar usuario</h2><form th:action="@{/usuarios/{id}/actualizar(id=${usuario.id})}" method="post"><label>Correo electrónico (no se puede cambiar)</label><input th:value="${usuario.correo}" disabled><label>Nombre completo</label><input name="nombre" th:value="${usuario.nombre}" required maxlength="120"><label>Teléfono (9 dígitos)</label><input name="telefono" th:value="${usuario.telefono}" pattern="[0-9]{9}" required><label>Rol</label><select name="rol" required><option th:each="r:${roles}" th:value="${r}" th:text="${r}" th:selected="${r==usuario.rol}"></option></select><div class="actions"><a class="btn" th:href="@{/usuarios}">Cancelar</a><button class="primary">Guardar cambios</button></div></form></section></main></body></html>
