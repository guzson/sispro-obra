spring.application.name=sispro-obra

# PostgreSQL (se pueden sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sispro_obra}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Servidor web
server.port=${PORT:8080}

# Nunca mostrar mensajes internos, excepciones ni trazas al navegador
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Sesi\u00c3\u00b3n
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Poner COOKIE_SECURE=true cuando se publique con HTTPS
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Usuarios de demostraci\u00c3\u00b3n: DESACTIVADOS por defecto (activar solo en clase con DEMO_ENABLED=true)
sispro.demo.enabled=${DEMO_ENABLED:false}

# Administrador inicial (solo se crea si no existe ning\u00c3\u00ban administrador y el modo demo est\u00c3\u00a1 apagado).
# Si ADMIN_CLAVE est\u00c3\u00a1 vac\u00c3\u00ada, se genera una clave aleatoria y se muestra una sola vez en la consola.
sispro.admin.correo=${ADMIN_CORREO:admin@sispro.local}
sispro.admin.clave=${ADMIN_CLAVE:}
# Render termina el HTTPS en su proxy: respetar X-Forwarded-Proto/Host
server.forward-headers-strategy=framework