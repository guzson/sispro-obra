<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cronograma | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><div class="page-top"><div><div class="eyebrow">PLANIFICACIÓN</div><h1>Cronograma de obra</h1><p class="sub">Seguimiento de tareas, responsables y porcentajes de avance.</p></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Obra</th><th>Tarea</th><th>Fechas</th><th>Responsable</th><th>Avance</th></tr></thead><tbody><tr th:each="t:${tareas}"><td><a th:href="@{/obras/{id}(id=${t.obra.id})}" th:text="${t.obra.nombre}"></a></td><td th:text="${t.nombre}"></td><td th:text="${t.inicio+' — '+t.fin}"></td><td th:text="${t.responsable!=null?t.responsable.nombre:'Sin asignar'}"></td><td><div class="progress"><div th:style="'width:'+${t.avance}+'%'"></div></div><small th:text="${t.avance+'%'}"></small></td></tr><tr th:if="${#lists.isEmpty(tareas)}"><td colspan="5" class="empty">No hay tareas para mostrar.</td></tr></tbody></table></div></section></main><footer class="footer">SISPRO-OBRA · Sistema académico de gestión de obras · Spring Boot / PostgreSQL</footer></body></html>
