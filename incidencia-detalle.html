<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento de incidencia | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><div class="page-top"><div><a class="back" th:href="@{/incidencias}">← Volver a incidencias</a><h1 th:text="${incidencia.titulo}"></h1><p class="sub"><span th:text="${incidencia.obra.nombre}"></span> · <span th:text="${incidencia.etapa}"></span></p></div><span class="pill large" th:text="${incidencia.estado}"></span></div><div class="two-col"><section class="panel"><h2>Datos de la incidencia</h2><p th:text="${incidencia.descripcion}"></p><div class="info-grid"><div><span class="muted">Tipo</span><p th:text="${incidencia.tipo}"></p></div><div><span class="muted">Prioridad</span><p th:text="${incidencia.prioridad}"></p></div><div><span class="muted">Responsable</span><p th:text="${incidencia.responsable!=null?incidencia.responsable.nombre:'No asignado'}"></p></div><div><span class="muted">Registrada</span><p th:text="${incidencia.creada}"></p></div></div><div th:if="${incidencia.solucion!=null}" class="toast success"><b>Solución:</b> <span th:text="${incidencia.solucion}"></span></div><div th:if="${incidencia.motivoAnulacion!=null}" class="toast danger"><b>Anulación:</b> <span th:text="${incidencia.motivoAnulacion}"></span></div><div th:if="${#authorization.expression('hasAnyRole(''ADMINISTRADOR'',''SUPERVISOR'')')}"><h3>Gestión</h3><form th:if="${incidencia.estado.name()!='RESUELTA' and incidencia.estado.name()!='ANULADA'}" th:action="@{/incidencias/{id}/asignar(id=${incidencia.id})}" method="post"><label>Asignar responsable<select name="usuarioId"><option th:each="u:${integrantes}" th:value="${u.id}" th:text="${u.nombre}"></option></select></label><label>Prioridad<select name="prioridad"><option th:each="p:${prioridades}" th:value="${p}" th:text="${p}" th:selected="${p==incidencia.prioridad}"></option></select></label><button class="primary">Asignar / actualizar</button></form><form th:if="${incidencia.estado.name()!='RESUELTA' and incidencia.estado.name()!='ANULADA'}" th:action="@{/incidencias/{id}/estado(id=${incidencia.id})}" method="post"><label>Avanzar estado<input type="hidden" name="estado" th:value="${incidencia.estado.name()=='PENDIENTE'?'ASIGNADA':(incidencia.estado.name()=='ASIGNADA'?'EN_PROCESO':'RESUELTA')}"></label><textarea th:if="${incidencia.estado.name()=='EN_PROCESO'}" name="solucion" required placeholder="Describe la solución aplicada"></textarea><button class="primary">Siguiente estado</button></form><details th:if="${incidencia.estado.name()!='RESUELTA' and incidencia.estado.name()!='ANULADA'}"><summary>Anular incidencia</summary><form th:action="@{/incidencias/{id}/anular(id=${incidencia.id})}" method="post"><label>Motivo de anulación<textarea name="motivo" required></textarea></label><button class="danger">Confirmar anulación</button></form></details></div></section><section class="panel"><h2>Seguimiento y comentarios</h2><div class="comment" th:each="c:${comentarios}"><div class="comment-top"><strong th:text="${c.autor.nombre}"></strong><small th:text="${c.creada}"></small></div><p th:text="${c.texto}"></p></div><div class="empty" th:if="${#lists.isEmpty(comentarios)}">Aún no hay comentarios de seguimiento.</div><form th:action="@{/incidencias/{id}/comentarios(id=${incidencia.id})}" method="post"><label>Agregar comentario<textarea name="texto" required placeholder="Escribe un avance o seguimiento..."></textarea></label><button class="primary">Publicar comentario</button></form></section></div></main><footer class="footer">SISPRO-OBRA · Sistema académico de gestión de obras · Spring Boot / PostgreSQL</footer></body></html>
