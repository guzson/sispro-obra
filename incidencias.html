<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incidencias | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><section class="panel"><div class="eyebrow">SEGUIMIENTO</div><h1>Gestión de incidencias</h1><p class="sub">Reporta, asigna y soluciona incidencias de tus obras.</p><p><a class="btn primary" th:href="@{/incidencias/nueva}">+ Nueva incidencia</a></p><table><thead><tr><th>Obra</th><th>Título</th><th>Tipo</th><th>Etapa</th><th>Estado</th><th>Cambiar estado</th></tr></thead><tbody><tr th:each="i:${incidencias}"><td th:text="${i.obra.nombre}"></td><td><a class="item-link" th:href="@{/incidencias/{id}(id=${i.id})}" th:text="${i.titulo}"></a><div class="muted" th:text="${i.descripcion}"></div></td><td th:text="${i.tipo}"></td><td th:text="${i.etapa}"></td><td th:text="${i.estado}"></td><td><form th:if="${#authorization.expression('hasAnyRole(''ADMINISTRADOR'',''SUPERVISOR'')') and i.estado.name()!='RESUELTA' and i.estado.name()!='ANULADA'}" th:action="@{/incidencias/{id}/estado(id=${i.id})}" method="post"><input type="hidden" name="estado" th:value="${i.estado.name()=='PENDIENTE'?'ASIGNADA':(i.estado.name()=='ASIGNADA'?'EN_PROCESO':'RESUELTA')}"><input th:if="${i.estado.name()=='EN_PROCESO'}" name="solucion" placeholder="Describa la solución" required><button class="primary small" th:text="${i.estado.name()=='PENDIENTE'?'Asignar':(i.estado.name()=='ASIGNADA'?'En proceso':'Resolver')}"></button></form></td></tr></tbody></table></section></main><footer>SISPRO-OBRA · Proyecto académico Java + Spring Boot + PostgreSQL</footer></body></html>
