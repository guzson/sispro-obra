<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><section class="panel narrow"><h2>Mi perfil</h2><p><b>Correo:</b> <span th:text="${usuario.correo}"></span></p><p><b>Rol:</b> <span th:text="${usuario.rol}"></span></p><form th:action="@{/perfil}" method="post"><label>Nombre</label><input name="nombre" th:value="${usuario.nombre}" required><label>Teléfono</label><input name="telefono" th:value="${usuario.telefono}" pattern="[0-9]{9}" required><button class="primary">Guardar cambios</button></form></section></main><footer>SISPRO-OBRA · Proyecto académico Java + Spring Boot + PostgreSQL</footer></body></html>
