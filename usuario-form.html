<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo usuario | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: header}"></div><main class="workspace"><div th:replace="~{fragments/nav :: alerts}"></div><section class="panel narrow"><h2>Nuevo usuario</h2><form th:action="@{/usuarios/guardar}" method="post"><label>Nombre completo</label><input name="nombre" required><label>Correo electrónico</label><input type="email" name="correo" required><label>Teléfono (9 dígitos)</label><input name="telefono" pattern="[0-9]{9}" required><label>Rol</label><select name="rol" required><option th:each="r:${roles}" th:value="${r}" th:text="${r}"></option></select><label>Obra asignada (opcional)</label><select name="obraId"><option value="">Sin asignar</option><option th:each="o:${obras}" th:value="${o.id}" th:text="${o.nombre}"></option></select><label>Contraseña inicial (8 caracteres, mayúscula, minúscula, número)</label><input type="password" name="clave" required minlength="8"><div class="actions"><a class="btn" th:href="@{/usuarios}">Cancelar</a><button class="primary">Registrar usuario</button></div></form></section></main><footer>SISPRO-OBRA · Proyecto académico Java + Spring Boot + PostgreSQL</footer></body></html>
