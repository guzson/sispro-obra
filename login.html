<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | SISPRO-OBRA</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><header style="text-align:center"><h1>SISPRO-OBRA</h1><p>Sistema de Gestión de Obras</p></header><main><section class="panel narrow"><h2>Inicio de sesión</h2><p class="error" th:if="${param.error}">Correo o contraseña incorrectos.</p><p class="ok" th:if="${param.logout}">Sesión cerrada.</p><p class="ok" th:if="${param.registrado}">Cuenta creada. Inicia sesión.</p><form th:action="@{/login}" method="post"><label>Correo electrónico</label><input type="email" name="username" required placeholder="usuario@empresa.com"><label>Contraseña</label><input type="password" name="password" required><button class="primary" type="submit" style="width:100%">Iniciar sesión</button></form><p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate como trabajador</a></p><p style="font-size:.86rem">Prueba: admin@sispro.local / Admin1234</p></section></main></body></html>
